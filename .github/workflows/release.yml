name: Release
run-name: Publish ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable version tag to publish (for example, v1.2.3)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.verify.outputs.commit }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 26
          package-manager-cache: false
      - name: Resolve tag and verify package version
        id: verify
        run: node scripts/verify-release.cjs
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_WORKFLOW_COMMIT: ${{ github.sha }}

  test:
    name: Validate release commit
    needs: prepare
    uses: ./.github/workflows/test.yml
    with:
      ref: ${{ needs.prepare.outputs.commit }}

  publish:
    name: Publish to npm and GitHub
    needs: [prepare, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
      - name: Verify the tag still points to the tested commit
        run: test "$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")" = "$RELEASE_COMMIT"
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN || secrets.NPM_AUTH_TOKEN }}
      - name: Create GitHub release
        run: gh release create "$RELEASE_TAG" --verify-tag --title "ts-prune $RELEASE_TAG" --notes-file RELEASE_NOTES.md
        env:
          GH_TOKEN: ${{ github.token }}
